name: Apply SigNoz observability integration

on:
  push:
    branches:
      - agent/signoz-observability
    paths:
      - .github/patches/signoz-worker.patch
      - .github/workflows/apply-signoz-observability.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/patches/signoz-worker.patch
      - .github/workflows/apply-signoz-observability.yml
      - casting.yaml
      - package.json
      - packages/engine/**
      - apps/api/**
      - apps/worker/**

permissions:
  contents: write

jobs:
  apply-verify-and-lock:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/signoz-observability
          fetch-depth: 0

      - name: Apply worker telemetry patch
        run: |
          git apply --check .github/patches/signoz-worker.patch
          git apply --whitespace=fix .github/patches/signoz-worker.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Build all workspaces
        run: npm run build

      - name: Set up Go for Foundry
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Generate Foundry lockfile
        run: |
          go install github.com/SigNoz/foundry/cmd/foundryctl@v0.2.16
          "$(go env GOPATH)/bin/foundryctl" forge -f casting.yaml -p /tmp/talos-signoz-pours
          test -f casting.yaml.lock

      - name: Commit verified generated files
        run: |
          rm -f .github/patches/signoz-worker.patch
          rm -f .github/workflows/apply-signoz-observability.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete SigNoz observability integration"
          git push origin HEAD:agent/signoz-observability
